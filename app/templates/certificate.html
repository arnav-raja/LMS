<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: 1040px 720px;
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px;
    background: #F4F1EA;
    font-family: 'Inter', sans-serif;
  }

  .sheet {
    width: 960px;
    margin: 0 auto;
    background: #FFFDF9;
    border: 2px solid #AFAFB4;
    padding: 6px;
  }

  .inner {
    border: 1px solid #C9A13B;
    padding: 60px 72px 56px;
    position: relative;
  }

  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid #8C8C8C;
  }
  .tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .brand-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  .crest {
    height: 108px;
    width: auto;
    display: block;
  }

  .wordmark {
    height: 46px;
    width: auto;
    display: block;
    margin-top: 14px;
  }

  .rule {
    width: 90px;
    height: 1px;
    background: #C9A13B;
    margin: 26px auto 0;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: 30px;
    font-weight: 600;
    color: #0F0F0F;
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 26px;
  }

  .presented {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #2A2A2A;
    text-align: center;
    margin-top: 46px;
  }

  .student-name {
    font-family: 'Source Serif 4', serif;
    font-size: 36px;
    font-weight: 600;
    color: #0F0F0F;
    text-align: center;
    margin: 12px 0 6px;
    padding-bottom: 14px;
    border-bottom: 1px solid #E3D8CC;
  }

  .for-completing {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #2A2A2A;
    text-align: center;
    margin-top: 28px;
  }

  .course-title {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 600;
    color: #0F0F0F;
    text-align: center;
    margin-top: 8px;
  }

  .meta-row {
    display: flex;
    justify-content: center;
    gap: 72px;
    margin-top: 52px;
  }

  .meta {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #8C8C8C;
    text-align: center;
  }

  .meta strong {
    color: #2A2A2A;
    display: block;
    font-size: 13px;
    margin-top: 2px;
  }

  .signatures {
    display: flex;
    justify-content: center;
    gap: 100px;
    margin-top: 54px;
  }

  .sig-block {
    text-align: center;
    width: 220px;
  }

  .sig-name {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 24px;
    color: #0F0F0F;
    border-bottom: 1px solid #2A2A2A;
    padding-bottom: 6px;
    margin-bottom: 6px;
  }

  .sig-title {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: #6B4F3A;
    letter-spacing: 0.5px;
  }
</style>
</head>
