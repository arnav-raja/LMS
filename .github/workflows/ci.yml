name: CI

# The two projects deploy separately, so they are checked separately. Both
# run on every push and pull request — a green tick here is what makes it
# safe to merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # The suite runs against real PostgreSQL, not SQLite, so that foreign
    # keys, CHECK constraints and timestamptz behave here exactly as they
    # do in production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: lms_test
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://lms_test:lms_test@localhost:5432/lms_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # tests/conftest.py sets every variable the app needs before
      # app.config is imported, so no secrets are required here.
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
