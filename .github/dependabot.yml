# Tells GitHub to watch our dependencies and open a pull request when one
# has a security fix or a new version.
#
# Worth having here because this app handles sign-in, passwords and a
# database. A hole in something we depend on is a hole in the app, and
# without this nobody finds out.
#
# Weekly, and capped, so it does not become noise nobody reads.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "backend deps"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "frontend deps"

  # The CI workflow pins action versions too, and those go stale as well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
