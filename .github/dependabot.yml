# Dependabot, deliberately kept quiet.
#
# `open-pull-requests-limit: 0` switches off *version* updates — the
# routine "a newer release exists" pull requests. It does not switch off
# security updates, which are a separate GitHub feature and keep working.
#
# So: you still get told when something you depend on has a known
# vulnerability, and you no longer get a pull request every time any
# package publishes any release.
#
# Why it is set this way: turning version updates on for the first time
# made Dependabot open thirteen pull requests at once, one per
# out-of-date package. Most were major-version jumps that would have
# broken the app if merged — bcrypt 5 against passlib would have stopped
# sign-in working, and React Router 7 would have broken every route. None
# of them are things to merge without testing one at a time.
#
# To upgrade something on purpose, do it by hand, run the tests, and
# commit it like any other change.
#
# To turn routine updates back on, raise the limit below. Expect a burst
# of pull requests the first time, one per package that is behind.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
